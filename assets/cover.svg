<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" preserveAspectRatio="xMidYMid meet" width="560" height="400">
  <rect width="560" height="400" fill="#FAFAF7"/>

  <!-- Branches: origin -> each endpoint (top 3 cocoa, rest hairline) -->
  <line x1="110" y1="200" x2="310.00" y2="60"  stroke="#6B4226" stroke-opacity="0.55" stroke-width="1.25"/>
  <line x1="110" y1="200" x2="317.24" y2="100" stroke="#6B4226" stroke-opacity="0.55" stroke-width="1.25"/>
  <line x1="110" y1="200" x2="322.07" y2="140" stroke="#6B4226" stroke-opacity="0.55" stroke-width="1.25"/>
  <line x1="110" y1="200" x2="326.90" y2="180" stroke="#0A0A0A" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="110" y1="200" x2="331.72" y2="220" stroke="#0A0A0A" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="110" y1="200" x2="338.97" y2="260" stroke="#0A0A0A" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="110" y1="200" x2="348.62" y2="300" stroke="#0A0A0A" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="110" y1="200" x2="365.52" y2="340" stroke="#0A0A0A" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Score bars + endpoint dots -->
  <g>
    <line x1="310.00" y1="60"  x2="470" y2="60"  stroke="#6B4226" stroke-opacity="0.9" stroke-width="2"/>
    <circle cx="475" cy="60" r="5" fill="#6B4226"/>
    <line x1="317.24" y1="100" x2="470" y2="100" stroke="#6B4226" stroke-opacity="0.9" stroke-width="2"/>
    <circle cx="475" cy="100" r="5" fill="#6B4226"/>
    <line x1="322.07" y1="140" x2="470" y2="140" stroke="#6B4226" stroke-opacity="0.9" stroke-width="2"/>
    <circle cx="475" cy="140" r="5" fill="#6B4226"/>

    <line x1="326.90" y1="180" x2="470" y2="180" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.25"/>
    <circle cx="475" cy="180" r="3.5" fill="none" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="331.72" y1="220" x2="470" y2="220" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.25"/>
    <circle cx="475" cy="220" r="3.5" fill="none" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="338.97" y1="260" x2="470" y2="260" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.25"/>
    <circle cx="475" cy="260" r="3.5" fill="none" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="348.62" y1="300" x2="470" y2="300" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.25"/>
    <circle cx="475" cy="300" r="3.5" fill="none" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="365.52" y1="340" x2="470" y2="340" stroke="#0A0A0A" stroke-opacity="0.35" stroke-width="1.25"/>
    <circle cx="475" cy="340" r="3.5" fill="none" stroke="#0A0A0A" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Score labels on the 3 winners -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B4226" style="font-variant-numeric: tabular-nums;">
    <text x="486" y="64">9.4</text>
    <text x="486" y="104">9.1</text>
    <text x="486" y="144">8.9</text>
  </g>

  <!-- Rank markers (01, 02, 03) -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#6B4226" fill-opacity="0.65" text-anchor="end" style="text-transform: uppercase; font-variant-numeric: tabular-nums;">
    <text x="298.00" y="64">01</text>
    <text x="305.24" y="104">02</text>
    <text x="310.07" y="144">03</text>
  </g>

  <!-- Origin: input hook -->
  <circle cx="110" cy="200" r="14" fill="none" stroke="#2C4A6E" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="110" cy="200" r="7" fill="#2C4A6E"/>

  <!-- Overline -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.44">
    <rect x="22" y="16.5" width="5" height="5" fill="#6B4226" rx="1"/>
    <text x="34" y="22" fill="#0A0A0A" fill-opacity="0.55" style="text-transform: uppercase;">HOOK LAB</text>
  </g>
</svg>
